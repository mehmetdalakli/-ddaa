name: Geri test

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-verisi
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gecmis testi calistir
        run: node geri-test.mjs

      - name: Kaydet
        run: |
          git config user.name "veri-bot"
          git config user.email "veri-bot@users.noreply.github.com"
          git add data/backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "Gecmis testi guncellendi"
          git pull --rebase
          git push
