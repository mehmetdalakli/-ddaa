<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İddaa Analiz</title>
<meta name="theme-color" content="#172554">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --navy:#172554;--navy2:#1e3a8a;--bg:#eef2f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;
  --blue:#2563eb;--sky:#38bdf8;--gold:#facc15;--amber:#f59e0b;--orange:#ea580c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;gap:10px}
.date{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sky)}
.dot.demo{background:var(--gold)}
h1{font-size:21px;margin:2px 0 0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font:600 11px ui-monospace,monospace;padding:4px 8px;border-radius:8px;border:1px solid var(--sky);color:var(--sky);letter-spacing:.5px}
.badge.demo{border-color:var(--gold);color:var(--gold)}
.ibtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;width:42px;height:42px;font-size:19px}
.ibtn.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.svc{font-size:12px;opacity:.75;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15);display:flex;justify-content:space-between}
main{padding:14px}
.hero{background:linear-gradient(140deg,#1e3a8a,#172554);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 20px rgba(23,37,84,.25)}
.hero small{letter-spacing:1.5px;opacity:.8;font-size:11px}
.hero h2{color:var(--gold);margin:8px 0 4px;font-size:22px}
.hero p{margin:0;opacity:.85;font-size:14px}
.hstats{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15)}
.hstats b{display:block;font-size:17px}.hstats span{font-size:11px;opacity:.7}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);font-size:15px;margin-bottom:12px;background:#fff}
.sec{display:flex;align-items:center;gap:8px;margin:6px 2px 10px}
.sec h3{margin:0;font-size:17px}
.pill{background:var(--blue);color:#fff;border-radius:999px;font-size:12px;padding:3px 9px}
.lg{font-size:12px;font-weight:600;color:var(--mute);margin:14px 4px 6px;text-transform:uppercase;letter-spacing:.6px}
.m{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line)}
.m .t{font-size:13px;color:var(--mute);text-align:center}
.m .t.live{color:var(--blue);font-weight:700}
.m .nm{font-size:15px;line-height:1.45}
.m .nm>div{display:flex;justify-content:space-between;gap:6px}
.m .nm>div.sub,.m .nm>div.chk{display:block;line-height:1.6}
.m .nm em{font-style:normal;font-weight:700}
.prob{display:flex;gap:4px}
.prob span{font-size:11px;background:#f1f5f9;border-radius:8px;padding:4px 6px;text-align:center;min-width:38px}
.prob span b{display:block;font-size:13px}
.prob span.top{background:#dbeafe;color:var(--navy2)}
.vtag{font-size:10px;background:var(--gold);color:#422006;border-radius:6px;padding:1px 5px;margin-left:4px;font-weight:700}
.empty{background:#fff;border-radius:18px;padding:30px 18px;text-align:center;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mute);font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:20px;width:46px;height:30px;line-height:30px;border-radius:12px}
nav button.on{color:var(--navy)}
nav button.on i{background:#dbeafe}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h4{margin:0 0 10px;font-size:15px}
.bar{display:flex;height:30px;border-radius:10px;overflow:hidden;font-size:12px;font-weight:700;color:#fff}
.bar div{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.b1{background:var(--blue)}.bx{background:#94a3b8}.b2{background:var(--orange)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mk{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px}
.mk .r{display:flex;justify-content:space-between;align-items:center}
.mk small{color:var(--mute)}
.mk input{width:66px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:center}
.mk.val{border-color:var(--amber);background:#fffbeb}
.ev{font-size:12px;font-weight:700}
.ev.pos{color:#b45309}.ev.neg{color:var(--mute)}
.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scores div{background:#f1f5f9;border-radius:10px;text-align:center;padding:6px 0;font-size:12px}
.scores b{display:block;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
td:first-child,th:first-child{text-align:left}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:10;display:none}
.sheet.on{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh h3{flex:1;margin:0;font-size:18px}
.x{border:0;background:#e2e8f0;border-radius:10px;width:36px;height:36px;font-size:18px}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.f+input,.f+select,input.full,select.full{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:600;width:100%;margin-top:12px}
.btn.alt{background:#e2e8f0;color:var(--ink)}
.note{font-size:12px;color:var(--mute);line-height:1.5}
.lgsel{display:flex;flex-wrap:wrap;gap:6px}
.ev-row{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:20;display:none;max-width:90vw}
.cp{background:#fff;border-radius:18px;border:1px solid var(--line);margin-bottom:14px;overflow:hidden}
.cp-h{padding:12px 14px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.cp-h b{font-size:16px}.cp-h small{display:block;opacity:.85;font-size:12px}
.cp.k1 .cp-h{background:var(--blue)}.cp.k2 .cp-h{background:#ca8a04}.cp.k3 .cp-h{background:var(--orange)}
.cp-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.cp-row .mt{color:var(--mute);font-size:11px}
.cp-row .pk{font-weight:700}
.cp-row .od{font-weight:700;min-width:44px;text-align:right}
.cp-f{display:grid;grid-template-columns:repeat(3,1fr);padding:10px 14px;gap:6px;text-align:center;font-size:11px;color:var(--mute)}
.cp-f b{display:block;font-size:16px;color:var(--ink)}
.cp-a{display:flex;gap:8px;padding:0 14px 14px}
.cp-a button{flex:1;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:9px;font-size:13px}
.hbtn{margin-top:12px;width:100%;background:var(--gold);color:#422006;border:0;border-radius:12px;padding:11px;font-weight:700;font-size:14px}
.sub{font-size:11px;color:var(--mute);margin-top:2px}
.cf{font-size:10px;border-radius:6px;padding:1px 5px;font-weight:700;white-space:nowrap}
.cf.c3{background:#dbeafe;color:#1e3a8a}.cf.c2{background:#fef9c3;color:#713f12}.cf.c1{background:#e2e8f0;color:#475569}
.chk{font-size:11px;font-weight:700;color:var(--navy2);margin-top:2px}
.chip.sm{padding:5px 10px;font-size:12px}
.ins{display:grid;grid-template-columns:24px 1fr;gap:6px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.ins:last-child{border:0}
.fl{display:inline-flex;gap:2px;vertical-align:middle}
.fl i{font-style:normal;font-size:10px;font-weight:700;width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;color:#fff}
.fl i.G{background:var(--blue)}.fl i.B{background:#94a3b8}.fl i.M{background:var(--orange)}
.stt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:11px;color:var(--mute);margin:6px 0}
.stt b{display:block;font-size:14px;color:var(--ink)}
.hist .r{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 0}
.hist .small{font-size:12px}.hist .mute{color:var(--mute)}
.dr{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:#e2e8f0}
.dr.ok{background:var(--blue);color:#fff}.dr.no{background:var(--orange);color:#fff}
.hstats div{min-width:0}
.cp-row.my{grid-template-columns:1fr auto 64px 34px}
.oi{width:60px;padding:6px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:14px;font-weight:700}
.rm{border:0;background:#e2e8f0;border-radius:8px;width:32px;height:32px}
.addk{margin-top:6px;width:100%;border:1px dashed var(--blue);background:#eff6ff;color:var(--navy2);border-radius:8px;padding:5px;font-size:12px;font-weight:600}
.addk.on{background:var(--blue);color:#fff;border-style:solid}
#nav button{position:relative}
.bdg{position:absolute;top:2px;right:24%;background:var(--orange);color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-style:normal}
.pn{color:var(--blue)!important}.nn{color:var(--orange)!important}
.warn{background:#fef9c3;border:1px solid var(--gold);color:#422006;border-radius:12px;padding:10px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div style="flex:1;min-width:0">
      <div class="date"><span class="dot" id="dot"></span><span id="today"></span></div>
      <div class="hrow"><h1>İddaa Analiz</h1><span class="badge" id="badge">…</span></div>
    </div>
    <button class="ibtn" id="refresh" title="Yenile">⟳</button>
  </div>
  <div class="svc"><span id="svc">Servis: hazırlanıyor</span><span id="upd"></span></div>
</header>

<main id="view"></main>

<nav id="nav">
  <button data-tab="bulten" class="on"><i>📅</i>Canlı Bülten</button>
  <button data-tab="kupon"><i>🎟️</i>Kuponlar</button>
  <button data-tab="analiz"><i>📊</i>Analiz</button>
  <button data-tab="value"><i>📈</i>Değerli (+EV)</button>
  <button data-tab="ayar"><i>⚙️</i>Ayarlar</button>
</nav>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   İDDAA ANALİZ — tek dosya PWA
   Veri: ESPN açık JSON API (anahtarsız)  +  isteğe bağlı The Odds API (ücretsiz anahtar)
   Model: Poisson (Dixon-Coles düzeltmeli), lig ortalamasına göre hücum/savunma gücü
   ============================================================ */

const LEAGUES = [
  {id:'tur.1', name:'Süper Lig',        odds:'soccer_turkey_super_league'},
  {id:'tur.2', name:'1. Lig',           odds:null},
  {id:'eng.1', name:'Premier League',   odds:'soccer_epl'},
  {id:'eng.2', name:'Championship',     odds:'soccer_efl_champ'},
  {id:'esp.1', name:'La Liga',          odds:'soccer_spain_la_liga'},
  {id:'ita.1', name:'Serie A',          odds:'soccer_italy_serie_a'},
  {id:'ger.1', name:'Bundesliga',       odds:'soccer_germany_bundesliga'},
  {id:'fra.1', name:'Ligue 1',          odds:'soccer_france_ligue_one'},
  {id:'ned.1', name:'Eredivisie',       odds:'soccer_netherlands_eredivisie'},
  {id:'por.1', name:'Portekiz',         odds:'soccer_portugal_primeira_liga'},
  {id:'bel.1', name:'Belçika',          odds:'soccer_belgium_first_div'},
  {id:'uefa.champions', name:'Şampiyonlar Ligi', odds:'soccer_uefa_champs_league'},
  {id:'uefa.europa',    name:'Avrupa Ligi',      odds:'soccer_uefa_europa_league'},
  {id:'uefa.europa.conf', name:'Konferans Ligi', odds:'soccer_uefa_europa_conference_league'},
];
const LG = Object.fromEntries(LEAGUES.map(l=>[l.id,l]));

const PROXIES = {
  direct: u=>u,
  allorigins: u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
};

/* ---------- güvenli localStorage ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

const DEF = {leagues:['tur.1','eng.1','esp.1','ita.1','ger.1','fra.1','uefa.champions','uefa.europa'],
  proxy:'auto', oddsKey:'', k:4, bank:1000, minEV:5, kelly:25, rho:-0.05, halfLife:45, market:60, sv:2, kuponGun:'1'};
const _st=store.get('ia_settings',{});let S = Object.assign({}, DEF, _st);
if((_st.sv||0)<2){S.market=60;S.minEV=Math.max(S.minEV||0,5);S.sv=2;try{localStorage.setItem('ia_settings',JSON.stringify(S))}catch(e){}}
let manualOdds = store.get('ia_odds',{});        // {matchId:{1:2.1,...}}
let apiOdds = store.get('ia_apiodds',{t:0,data:{}});

let state = {tab:'bulten', day:0, lgFilter:'all', flt:'all', ver:0, teamGames:{}, resById:{}, names:{}, lgRes:{}, q:'', matches:[], standings:{}, mode:'?', loading:false, lastProxy:null};

/* ---------- yardımcılar ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = p=>(p*100).toFixed(0)+'%';
const fx = (n,d=2)=>Number.isFinite(n)?n.toFixed(d):'-';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2600)}
function ymd(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
function dayDate(off){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+off);return d}
function sameLocalDay(iso,d){const x=new Date(iso);return x.getFullYear()==d.getFullYear()&&x.getMonth()==d.getMonth()&&x.getDate()==d.getDate()}
function hhmm(iso){return new Date(iso).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'i')
  .replace(/\b(fc|sk|as|ac|afc|cf|sc|fk|jk|ss|ud|cd|club|calcio|spor kulubu|1907|1903|1905)\b/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function nameSim(a,b){const A=new Set(norm(a).split(' ').filter(w=>w.length>2)),B=new Set(norm(b).split(' ').filter(w=>w.length>2));
  if(!A.size||!B.size)return 0;let n=0;A.forEach(w=>{if(B.has(w))n++});return n/Math.min(A.size,B.size)}

/* ---------- ağ: doğrudan dene, olmazsa ücretsiz CORS proxy ---------- */
async function getJSON(url){
  const order = S.proxy==='auto' ? [state.lastProxy||'direct','direct','allorigins'] : [PROXIES[S.proxy]?S.proxy:'direct'];
  const tried=new Set();let lastErr;
  for(const p of order){ if(tried.has(p))continue; tried.add(p);
    try{
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
      const r=await fetch(PROXIES[p](url),{signal:ctl.signal});clearTimeout(to);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();state.lastProxy=p;return j;
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('ağ hatası');
}

/* ---------- ESPN: fikstür ---------- */
async function loadScoreboard(lg,d){
  const a=new Date(d);a.setDate(a.getDate()-1);const b=new Date(d);b.setDate(b.getDate()+1);
  const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard?dates=${ymd(a)}-${ymd(b)}&limit=200`;
  const j=await getJSON(url);
  return (j.events||[]).filter(ev=>sameLocalDay(ev.date,d)).map(ev=>parseEvent(ev,lg));
}
function amToDec(ml){const n=parseFloat(ml);if(!Number.isFinite(n)||n===0)return null;return n>0?1+n/100:1+100/Math.abs(n)}
function parseEvent(ev,lg){
  const c=(ev.competitions||[])[0]||{};const cs=c.competitors||[];
  const H=cs.find(x=>x.homeAway==='home')||cs[0]||{}, A=cs.find(x=>x.homeAway==='away')||cs[1]||{};
  const tm=x=>({id:String(x.team?.id||''),name:x.team?.displayName||x.team?.name||'?',short:x.team?.shortDisplayName||x.team?.abbreviation||x.team?.displayName||'?',
    logo:x.team?.logo||'',score:x.score!=null&&x.score!==''?Number(x.score):null,form:x.form||''});
  const st=ev.status||c.status||{};
  let espnOdds=null;const o=(c.odds||[])[0];
  if(o){const h=amToDec(o.homeTeamOdds?.moneyLine),a=amToDec(o.awayTeamOdds?.moneyLine),d=amToDec(o.drawOdds?.moneyLine);
    if(h&&a&&d)espnOdds={'1':+h.toFixed(2),'X':+d.toFixed(2),'2':+a.toFixed(2),src:o.provider?.name||'ESPN'}}
  return {id:String(ev.id),lg,date:ev.date,state:st.type?.state||'pre',detail:st.type?.shortDetail||'',clock:st.displayClock||'',
    home:tm(H),away:tm(A),espnOdds};
}

/* ---------- ESPN: puan durumu (model girdisi) ---------- */
async function loadStandings(lg){
  const cache=store.get('ia_st_'+lg,null);
  if(cache&&Date.now()-cache.t<6*3600e3)return cache.d;
  const j=await getJSON(`https://site.api.espn.com/apis/v2/sports/soccer/${lg}/standings`);
  const teams={};
  const walk=n=>{ if(!n)return;
    (n.standings?.entries||[]).forEach(e=>{const s={};(e.stats||[]).forEach(x=>{s[x.name||x.type]=x.value});
      teams[String(e.team?.id)]={name:e.team?.displayName,gp:+s.gamesPlayed||0,gf:+s.pointsFor||0,ga:+s.pointsAgainst||0,rank:+s.rank||null,pts:+s.points||0}});
    (n.children||[]).forEach(walk);};
  walk(j);
  store.set('ia_st_'+lg,{t:Date.now(),d:teams});
  return teams;
}

/* ---------- MODEL ----------
   1) Son 120 günün sonuçlarından, zamana göre ağırlıklı (yakın maç daha önemli), rakip gücüne göre düzeltilmiş
      hücum/savunma puanları ve ligin kendi ev sahibi avantajı hesaplanır.
   2) Sonuç verisi yoksa puan tablosundaki sezon ortalamalarına düşer.
   3) Poisson + Dixon-Coles ile skor olasılıkları; bahis sitesi oranı varsa modelle harmanlanır. */
function pois(k,l){let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p}
function leagueAvg(teams){let g=0,n=0;Object.values(teams).forEach(t=>{g+=t.gf;n+=t.gp});return n>20?g/n:1.35}

function buildIndex(repo){
  state.teamGames={};state.resById={};state.names={};state.lgRes={};state.rCache={};
  const add=(lg,id,ts,h,a,hg,ag)=>{
    if(state.resById[id])return;state.resById[id]=[hg,ag];
    (state.lgRes[lg]=state.lgRes[lg]||[]).push([id,ts,h,a,hg,ag]);
    (state.teamGames[h]=state.teamGames[h]||[]).push({id,ts,lg,opp:a,home:true,gf:hg,ga:ag});
    (state.teamGames[a]=state.teamGames[a]||[]).push({id,ts,lg,opp:h,home:false,gf:ag,ga:hg});
  };
  Object.entries(repo.leagues||{}).forEach(([lg,L])=>{
    Object.assign(state.names,L.names||{});
    (L.results||[]).forEach(r=>add(lg,String(r[0]),r[1],String(r[2]),String(r[3]),+r[4],+r[5]));
    (L.events||[]).forEach(ev=>{const m=parseEvent(ev,lg);state.names[m.home.id]=state.names[m.home.id]||m.home.short;state.names[m.away.id]=state.names[m.away.id]||m.away.short;
      if(m.state==='post'&&m.home.score!=null&&m.away.score!=null)add(lg,m.id,Date.parse(m.date),m.home.id,m.away.id,m.home.score,m.away.score)});
  });
  Object.values(state.teamGames).forEach(g=>g.sort((x,y)=>x.ts-y.ts));
}
function ratingsFor(lg){
  if(state.rCache&&state.rCache[lg]!==undefined)return state.rCache[lg];
  const R=(state.lgRes||{})[lg]||[];let out=null;
  if(R.length>=12){
    const now=Date.now(),HL=Math.max(7,S.halfLife||45),K=3;
    const W=R.map(r=>Math.pow(.5,Math.max(0,now-r[1])/864e5/HL));
    let sw=0,sh=0,sa=0;R.forEach((r,i)=>{sw+=W[i];sh+=W[i]*r[4];sa+=W[i]*r[5]});
    const mu=(sh+sa)/(2*sw)||1.3,hfa=Math.min(1.45,Math.max(1,Math.sqrt((sh||1)/(sa||1))));
    const att={},def={},n={};R.forEach(r=>{[r[2],r[3]].forEach(t=>{att[t]=1;def[t]=1;n[t]=(n[t]||0)+1})});
    for(let it=0;it<12;it++){
      const nA={},dA={},nD={},dD={};const z=t=>{nA[t]=nA[t]||0;dA[t]=dA[t]||0;nD[t]=nD[t]||0;dD[t]=dD[t]||0};
      R.forEach((r,i)=>{const w=W[i],h=r[2],a=r[3];z(h);z(a);
        nA[h]+=w*r[4];dA[h]+=w*mu*def[a]*hfa; nA[a]+=w*r[5];dA[a]+=w*mu*def[h]/hfa;
        nD[h]+=w*r[5];dD[h]+=w*mu*att[a]/hfa; nD[a]+=w*r[4];dD[a]+=w*mu*att[h]*hfa;});
      const ts=Object.keys(att);let ma=0,md=0;
      ts.forEach(t=>{att[t]=(nA[t]+K*mu)/(dA[t]+K*mu);def[t]=(nD[t]+K*mu)/(dD[t]+K*mu);ma+=att[t];md+=def[t]});
      ma/=ts.length;md/=ts.length;ts.forEach(t=>{att[t]/=ma;def[t]/=md});
    }
    out={mu,hfa,att,def,n};
  }
  state.rCache=state.rCache||{};state.rCache[lg]=out;return out;
}
function lambdas(m){
  const T=state.standings[m.lg]||{};const h=T[m.home.id],a=T[m.away.id];
  const r=ratingsFor(m.lg);
  if(r&&r.n[m.home.id]>=3&&r.n[m.away.id]>=3){
    const lh=r.mu*r.att[m.home.id]*r.def[m.away.id]*r.hfa, la=r.mu*r.att[m.away.id]*r.def[m.home.id]/r.hfa;
    return {lh:Math.min(Math.max(lh,.15),5),la:Math.min(Math.max(la,.15),5),avg:r.mu,hfa:r.hfa,h,a,src:'form',
      nH:r.n[m.home.id],nA:r.n[m.away.id],lowData:false,
      attH:r.att[m.home.id],defH:r.def[m.home.id],attA:r.att[m.away.id],defA:r.def[m.away.id]};
  }
  const avg=leagueAvg(T),k=S.k,hfa=1.12;
  const att=t=>t?((t.gf+k*avg)/(t.gp+k))/avg:1, def=t=>t?((t.ga+k*avg)/(t.gp+k))/avg:1;
  const lh=avg*att(h)*def(a)*hfa, la=avg*att(a)*def(h)/hfa;
  return {lh:Math.min(Math.max(lh,.2),4.5),la:Math.min(Math.max(la,.2),4.5),avg,hfa,h,a,src:'sezon',nH:h?.gp||0,nA:a?.gp||0,lowData:!(h&&a&&h.gp>=3&&a.gp>=3)};
}
function minuteOf(m){const n=parseInt(String(m.clock).replace(/[^0-9+]/g,'').split('+')[0]);return Number.isFinite(n)?Math.min(n,90):45}
function marketProbs(m){ // bahis sitesi oranından marjı temizlenmiş olasılık (elle girilen oranlar hariç)
  let o=null;const ao=apiOdds.data[m.id];
  if(ao&&ao.avg&&ao.avg['1']&&ao.avg['X']&&ao.avg['2'])o=ao.avg;else if(ao&&ao['1']&&ao['X']&&ao['2'])o=ao;else if(m.espnOdds)o=m.espnOdds;
  if(!o)return null;const s=1/o['1']+1/o['X']+1/o['2'];return {h:1/o['1']/s,d:1/o['X']/s,a:1/o['2']/s};
}
const aCache=new Map();
function analyse(m){
  const key=m.id+'|'+m.state+'|'+m.clock+'|'+m.home.score+'|'+m.away.score+'|'+state.ver;
  if(aCache.has(key))return aCache.get(key);
  const L=lambdas(m);let lh=L.lh,la=L.la,bh=0,ba=0,live=false;
  if(m.state==='in'){live=true;const rem=Math.max(0,1-minuteOf(m)/90);lh*=rem;la*=rem;bh=m.home.score||0;ba=m.away.score||0}
  const N=10,M=[];let tot=0;
  for(let i=0;i<=N;i++){M[i]=[];for(let j=0;j<=N;j++){let p=pois(i,lh)*pois(j,la);
    if(!live){const r=S.rho;if(i===0&&j===0)p*=1-lh*la*r;else if(i===0&&j===1)p*=1+lh*r;else if(i===1&&j===0)p*=1+la*r;else if(i===1&&j===1)p*=1-r}
    M[i][j]=p;tot+=p}}
  const P={h:0,d:0,a:0,o15:0,o25:0,o35:0,btts:0,scores:[]};
  for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){const p=M[i][j]/tot,H=i+bh,A=j+ba,G=H+A;
    if(H>A)P.h+=p;else if(H===A)P.d+=p;else P.a+=p;
    if(G>1.5)P.o15+=p;if(G>2.5)P.o25+=p;if(G>3.5)P.o35+=p;if(H>0&&A>0)P.btts+=p;
    P.scores.push({s:H+'-'+A,p})}
  const agg={};P.scores.forEach(x=>agg[x.s]=(agg[x.s]||0)+x.p);
  P.scores=Object.entries(agg).map(([s,p])=>({s,p})).sort((x,y)=>y.p-x.p).slice(0,10);
  P.model={h:P.h,d:P.d,a:P.a};
  const q=!live?marketProbs(m):null;P.market=q;
  if(q){const w=(S.market??60)/100;P.h=(1-w)*P.h+w*q.h;P.d=(1-w)*P.d+w*q.d;P.a=(1-w)*P.a+w*q.a}
  if(!live){const av=apiOdds.data[m.id]?.avg;const w=(S.market??60)/100;P.mkTot={};
    [['15','o15'],['25','o25'],['35','o35']].forEach(([n,f])=>{const o=av?.['O'+n],u=av?.['U'+n];
      if(o>1&&u>1){const qo=(1/o)/(1/o+1/u);P.mkTot[f]=qo;P[f]=(1-w)*P[f]+w*qo}});}
  P.L=L;P.lh=L.lh;P.la=L.la;P.live=live;
  // güven
  const n=Math.min(L.nH||0,L.nA||0);const dis=q?Math.max(Math.abs(P.model.h-q.h),Math.abs(P.model.a-q.a)):0;P.dis=dis;
  P.conf=L.lowData||n<4?1:(n>=8&&dis<.10)?3:2;
  aCache.set(key,P);
  if(m.state==='pre'&&state.mode!=='demo')logPred(m,P);
  return P;
}
const CONF=['','Düşük','Orta','Yüksek'];

/* ---------- FORM & İÇGÖRÜLER ---------- */
function formOf(tid,n=5,venue=null,before=Infinity){
  let g=(state.teamGames||{})[tid]||[];g=g.filter(x=>x.ts<before&&(venue==null||x.home===venue));
  const L=g.slice(-n);const f={list:L.slice().reverse(),n:L.length,w:0,d:0,l:0,gf:0,ga:0,o25:0,btts:0,cs:0,fts:0,last:g.length?g[g.length-1].ts:null,all:g.length};
  L.forEach(x=>{if(x.gf>x.ga)f.w++;else if(x.gf===x.ga)f.d++;else f.l++;f.gf+=x.gf;f.ga+=x.ga;if(x.gf+x.ga>2.5)f.o25++;if(x.gf>0&&x.ga>0)f.btts++;if(x.ga===0)f.cs++;if(x.gf===0)f.fts++});
  f.ppg=f.n?(3*f.w+f.d)/f.n:0;return f;
}
function streak(tid){const g=((state.teamGames||{})[tid]||[]).slice().reverse();let unb=0,win=0,winless=0;
  for(const x of g){if(x.gf>=x.ga)unb++;else break}for(const x of g){if(x.gf>x.ga)win++;else break}for(const x of g){if(x.gf<=x.ga)winless++;else break}
  return {unb,win,winless}}
function insights(m,P){
  const out=[];const tms=[[m.home,true],[m.away,false]];const kick=Date.parse(m.date);
  tms.forEach(([t,isHome])=>{
    const f=formOf(t.id,5,null,kick),all=formOf(t.id,40,null,kick);if(f.n<3)return;
    const g5=f.gf/f.n,gAll=all.gf/all.n,c5=f.ga/f.n,cAll=all.ga/all.n,nm=esc(t.short);
    if(g5-gAll>=.6&&g5>=1.8)out.push(['🔥',`${nm} gole açıldı: son ${f.n} maçta ${f.gf} gol (maç başı ${fx(g5,1)}, öncesinde ${fx(gAll,1)}).`,'up']);
    if(gAll-g5>=.6&&g5<1.4)out.push(['🧊',`${nm} golde kısırlaştı: son ${f.n} maçta maç başı ${fx(g5,1)} gol (öncesinde ${fx(gAll,1)}).`,'down']);
    if(cAll-c5>=.5&&f.cs>=2)out.push(['🛡️',`${nm} savunması sıkılaştı: son ${f.n} maçın ${f.cs}'${f.cs>2?'ünde':'sinde'} gol yemedi.`,'']);
    if(c5-cAll>=.6)out.push(['⚠️',`${nm} son ${f.n} maçta ${f.ga} gol yedi (maç başı ${fx(c5,1)}).`,'']);
    if(f.o25>=4)out.push(['⚽',`${nm} son ${f.n} maçın ${f.o25}'inde 2,5 Üst bitti.`,'over']);
    if(f.o25<=1&&f.n>=5)out.push(['🔒',`${nm} son ${f.n} maçın ${f.n-f.o25}'inde 2,5 Alt bitti.`,'under']);
    if(f.fts>=3)out.push(['🚫',`${nm} son ${f.n} maçın ${f.fts}'ünde gol atamadı.`,'']);
    const s=streak(t.id);
    if(s.win>=4)out.push(['📈',`${nm} üst üste ${s.win} maçtır kazanıyor.`,'']);
    else if(s.unb>=6)out.push(['📈',`${nm} ${s.unb} maçtır yenilmiyor.`,'']);
    if(s.winless>=5)out.push(['📉',`${nm} ${s.winless} maçtır kazanamıyor.`,'']);
    const v=formOf(t.id,5,isHome,kick);
    if(v.n>=4&&v.ppg>=2.4)out.push(['🏟️',`${nm} ${isHome?'evinde':'deplasmanda'} son ${v.n} maçta ${v.w} galibiyet aldı.`,'']);
    if(v.n>=4&&v.ppg<=.6)out.push(['🏟️',`${nm} ${isHome?'evinde':'deplasmanda'} son ${v.n} maçta ${v.w===0?(v.d===0?'hiç puan alamadı':'hiç kazanamadı ('+v.d+' beraberlik)'):'sadece '+v.w+' kez kazandı'}.`,'']);
    if(f.last){const rest=(kick-f.last)/864e5;if(rest<3.6)out.push(['😓',`${nm} ${Math.max(1,Math.round(rest))} gün önce oynadı (yorgunluk riski).`,''])}
  });
  if(P.market&&P.dis>=.10){const fav=P.model.h>P.model.a?'h':'a';out.push(['⚖️',`Model ile bahis sitesi ayrışıyor: ${esc(fav==='h'?m.home.short:m.away.short)} kazanır — model %${fx(P.model[fav]*100,0)}, piyasa %${fx(P.market[fav]*100,0)}.`,''])}
  const T=state.standings[m.lg]||{},h=T[m.home.id],a=T[m.away.id];
  if(h?.rank&&a?.rank&&Math.abs(h.rank-a.rank)>=8)out.push(['📊',`Sıralama farkı büyük: ${esc(m.home.short)} ${h.rank}., ${esc(m.away.short)} ${a.rank}. sırada.`,'']);
  return out;
}

/* ---------- TAHMİN KAYDI (model karnesi için) ---------- */
let predLog=store.get('ia_log',{});let logDirty=false;
function logPred(m,P){if(Date.parse(m.date)<Date.now())return;
  predLog[m.id]={t:Date.parse(m.date),lg:m.lg,hn:m.home.short,an:m.away.short,h:+P.h.toFixed(3),d:+P.d.toFixed(3),a:+P.a.toFixed(3),o25:+P.o25.toFixed(3),b:+P.btts.toFixed(3)};logDirty=true;}
function saveLog(){if(!logDirty)return;const lim=Date.now()-45*864e5;Object.keys(predLog).forEach(k=>{if(predLog[k].t<lim)delete predLog[k]});store.set('ia_log',predLog);logDirty=false}
function hitOf(k,hg,ag){const G=hg+ag;return {'1':hg>ag,'X':hg===ag,'2':hg<ag,'1X':hg>=ag,'X2':hg<=ag,'12':hg!==ag,'O15':G>1.5,'U15':G<1.5,'O25':G>2.5,'U25':G<2.5,'O35':G>3.5,'U35':G<3.5,'KGV':hg>0&&ag>0,'KGY':!(hg>0&&ag>0)}[k]}
function karne(){
  const r={n:0,ms:0,ou:0,kg:0,brier:0};
  Object.entries(predLog).forEach(([id,p])=>{const s=state.resById?.[id];if(!s)return;const [hg,ag]=s;r.n++;
    const pick=p.h>=p.d&&p.h>=p.a?'1':p.a>=p.d?'2':'X';if(hitOf(pick,hg,ag))r.ms++;
    if(hitOf(p.o25>=.5?'O25':'U25',hg,ag))r.ou++;if(hitOf(p.b>=.5?'KGV':'KGY',hg,ag))r.kg++;
    const oh=hg>ag?1:0,od=hg===ag?1:0,oa=hg<ag?1:0;r.brier+=(p.h-oh)**2+(p.d-od)**2+(p.a-oa)**2;});
  return r;
}

const MARKETS=[
  ['1','MS 1',P=>P.h],['X','MS X',P=>P.d],['2','MS 2',P=>P.a],
  ['1X','ÇŞ 1-X',P=>P.h+P.d],['X2','ÇŞ X-2',P=>P.d+P.a],['12','ÇŞ 1-2',P=>P.h+P.a],
  ['O15','1,5 Üst',P=>P.o15],['U15','1,5 Alt',P=>1-P.o15],
  ['O25','2,5 Üst',P=>P.o25],['U25','2,5 Alt',P=>1-P.o25],
  ['O35','3,5 Üst',P=>P.o35],['U35','3,5 Alt',P=>1-P.o35],
  ['KGV','KG Var',P=>P.btts],['KGY','KG Yok',P=>1-P.btts],
];
function oddsFor(m){ // öncelik: elle girilen > Odds API > ESPN
  const o={};const src={};
  if(m.espnOdds)['1','X','2'].forEach(k=>{o[k]=m.espnOdds[k];src[k]=m.espnOdds.src});
  const ao=apiOdds.data[m.id];if(ao)Object.keys(ao).forEach(k=>{if(!['bk','avg','nb'].includes(k)){o[k]=ao[k];src[k]=ao.bk?.[k]||'Odds API'}});
  const mo=manualOdds[m.id];if(mo)Object.keys(mo).forEach(k=>{if(mo[k]>1){o[k]=mo[k];src[k]='Elle'}});
  return {o,src};
}
function evOf(p,odd){return p*odd-1}
function kellyStake(p,odd){const b=odd-1;const f=(b*p-(1-p))/b;return f>0?f*(S.kelly/100)*S.bank:0}
function valueBets(m,P){
  const {o,src}=oddsFor(m);const out=[];
  MARKETS.forEach(([k,l,f])=>{if(o[k]>1){const p=f(P),ev=evOf(p,o[k]);out.push({k,l,p,odd:o[k],ev,src:src[k],sus:ev>.20,stake:ev>.20?0:kellyStake(p,o[k])})}});
  return out;
}

/* ---------- The Odds API (isteğe bağlı) ---------- */
async function loadOddsAPI(){
  if(!S.oddsKey){toast('Önce Ayarlar\'dan Odds API anahtarını gir');return}
  const lgs=[...new Set(state.matches.map(m=>m.lg))].filter(l=>LG[l]?.odds);
  if(!lgs.length){toast('Bu liglerin oranı Odds API\'de yok');return}
  setBusy(true);let n=0,left='';
  for(const lg of lgs){
    try{
      const url=`https://api.the-odds-api.com/v4/sports/${LG[lg].odds}/odds/?apiKey=${encodeURIComponent(S.oddsKey)}&regions=eu&markets=h2h,totals&oddsFormat=decimal`;
      const r=await fetch(url);left=r.headers.get('x-requests-remaining')||left;
      if(!r.ok)throw new Error('HTTP '+r.status);
      const evs=await r.json();
      state.matches.filter(m=>m.lg===lg).forEach(m=>{
        const ev=evs.find(e=>nameSim(e.home_team,m.home.name)>=.5&&nameSim(e.away_team,m.away.name)>=.5);
        if(!ev)return;
        // bahis borsaları (Betfair Exchange, Matchbook vb.) hariç: oranları gerçekte alınamayabilir
        const EXCH=/betfair_ex|matchbook|smarkets|betdaq|exchange/i;const col={};
        const put=(k,price,bk)=>{(col[k]=col[k]||[]).push({price,bk})};
        (ev.bookmakers||[]).forEach(b=>{if(EXCH.test(b.key||'')||EXCH.test(b.title||''))return;(b.markets||[]).forEach(mk=>(mk.outcomes||[]).forEach(oc=>{
          if(mk.key==='h2h'){const k=oc.name===ev.home_team?'1':oc.name===ev.away_team?'2':'X';put(k,oc.price,b.title)}
          if(mk.key==='totals'&&[1.5,2.5,3.5].includes(oc.point)){const k=(oc.name==='Over'?'O':'U')+String(oc.point).replace('.','');put(k,oc.price,b.title)}
        }))});
        const best={bk:{},avg:{},nb:{}};
        Object.entries(col).forEach(([k,arr])=>{const avg=arr.reduce((a,x)=>a+x.price,0)/arr.length;arr.sort((a,b)=>b.price-a.price);
          // tek bir sitenin aşırı yüksek oranı yerine: en yüksek oran, ortalamanın en fazla %4 üstü
          const top=arr[0];best[k]=+Math.min(top.price,avg*1.04).toFixed(2);best.bk[k]=top.price>avg*1.04?'Piyasa üst sınırı':top.bk;best.avg[k]=+avg.toFixed(3);best.nb[k]=arr.length});
        if(Object.keys(best.avg).length){apiOdds.data[m.id]=best;n++}
      });
    }catch(e){console.warn(e)}
  }
  apiOdds.t=Date.now();store.set('ia_apiodds',apiOdds);state.ver++;aCache.clear();setBusy(false);
  toast(`${n} maça oran eklendi${left?` · kalan kredi: ${left}`:''}`);render();
}

/* ---------- GitHub'daki veri dosyası (GitHub Actions 15 dk'da bir günceller) ---------- */
async function loadRepoData(){
  const urls=[];const m=location.hostname.match(/^([^.]+)\.github\.io$/i);const repo=decodeURIComponent(location.pathname.split('/')[1]||'');
  if(m&&repo)urls.push(`https://raw.githubusercontent.com/${m[1]}/${repo}/main/data/espn.json?t=${Date.now()}`);
  urls.push('data/espn.json?t='+Date.now());
  for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.leagues)return j}}catch(e){state.err=String(e)}}
  return null;
}

/* ---------- yükleme ---------- */
function setBusy(b){state.loading=b;$('#refresh').classList.toggle('spin',b)}
async function loadAll(){
  setBusy(true);render();
  const d=dayDate(state.day);const lgs=S.leagues;
  const repo=await loadRepoData();
  if(repo){
    state.mode='repo';state.repo=repo;state.repoTime=repo.updated;state.standings={};buildIndex(repo);state.ver++;aCache.clear();
    Object.entries(repo.leagues||{}).forEach(([lg,L])=>state.standings[lg]=L.teams||{});
    state.matches=lgs.flatMap(lg=>{const L=repo.leagues[lg];if(!L)return[];
      return (L.events||[]).filter(ev=>sameLocalDay(ev.date,d)).map(ev=>parseEvent(ev,lg))}).sort((a,b)=>new Date(a.date)-new Date(b.date));
    setBusy(false);$('#upd').textContent='Veri '+new Date(repo.updated).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});render();
    clearTimeout(loadAll.t);if(state.matches.some(m=>m.state==='in'))loadAll.t=setTimeout(loadAll,120000);
    return;
  }
  state.repo=null;state.teamGames={};state.resById={};state.lgRes={};state.rCache={};state.names={};state.ver++;aCache.clear();
  const res=await Promise.allSettled(lgs.map(lg=>loadScoreboard(lg,d)));
  const ok=res.filter(r=>r.status==='fulfilled');
  if(!ok.length){state.mode='demo';state.matches=demo();const f=res.find(r=>r.status==='rejected');if(f)state.err=String(f.reason?.message||f.reason);}
  else{
    state.mode='live';state.matches=ok.flatMap(r=>r.value).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const need=[...new Set(state.matches.map(m=>m.lg))];
    const st=await Promise.allSettled(need.map(lg=>loadStandings(lg)));
    need.forEach((lg,i)=>{if(st[i].status==='fulfilled')state.standings[lg]=st[i].value});
  }
  setBusy(false);
  $('#upd').textContent='Güncelleme '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  render();
  clearTimeout(loadAll.t);
  if(state.mode==='live'&&state.matches.some(m=>m.state==='in'))loadAll.t=setTimeout(loadAll,60000); // canlı maç varsa 60 sn'de bir yenile
  if(state.mode==='demo')render();
}

  $('#badge').textContent=live?'CANLI API':state.mode==='demo'?'DEMO':'…';

}
const FILTERS=[
  ['all','Tümü',()=>true],
  ['fav','Güçlü favori',P=>Math.max(P.h,P.a)>=.60],
  ['o25','2,5 Üst adayı',P=>P.o25>=.60],
  ['u25','2,5 Alt adayı',P=>1-P.o25>=.58],
  ['kg','KG Var adayı',P=>P.btts>=.58],
  ['x','Beraberlik kokan',P=>P.d>=.30],
  ['trend','Trendli maçlar',(P,m)=>insights(m,P).length>=2],
  ['val','Değerli oran',(P,m)=>valueBets(m,P).some(v=>v.ev*100>=S.minEV)],
  ['conf','Yüksek güven',P=>P.conf===3],
];
function searchPool(){ // arama yapılırken: seçili günden bağımsız, verideki tüm günler ve tüm ligler
  if(!state.repo)return state.matches;
  if(state.poolVer!==state.ver){const seen=new Set();state.pool=[];state.extra=state.extra||{};
    Object.entries(state.repo.leagues||{}).forEach(([lg,L])=>(L.events||[]).forEach(ev=>{const m=parseEvent(ev,lg);if(seen.has(m.id))return;seen.add(m.id);state.pool.push(m);state.extra[m.id]=m}));
    state.pool.sort((a,b)=>new Date(a.date)-new Date(b.date));state.poolVer=state.ver}
  return state.pool;
}
function filtered(){
  const q=norm(state.q);const F=FILTERS.find(f=>f[0]===state.flt)||FILTERS[0];
  return (q?searchPool():state.matches).filter(m=>(state.lgFilter==='all'||m.lg===state.lgFilter)&&(!q||norm(m.home.name+' '+m.away.name).includes(q))&&
    (F[0]==='all'||(m.state!=='post'&&F[2](analyse(m),m))));
}
function timeCell(m){
  if(m.state==='in')return `<div class="t live">● ${esc(m.clock||'CANLI')}</div>`;
  if(m.state==='post')return `<div class="t">MS</div>`;
  return `<div class="t">${state.q?new Date(m.date).toLocaleDateString('tr-TR',{weekday:'short'})+'<br>':''}${hhmm(m.date)}</div>`;
}
function checkMark(m){ // bitmiş maçta, maç öncesi kaydedilen tahmin tuttu mu?
  const p=predLog[m.id];if(m.state!=='post'||!p||m.home.score==null)return '';
  const pick=p.h>=p.d&&p.h>=p.a?'1':p.a>=p.d?'2':'X';const ok=hitOf(pick,m.home.score,m.away.score);
  const ou=p.o25>=.5?'O25':'U25',ok2=hitOf(ou,m.home.score,m.away.score);
  return `<div class="chk">Tahmin: MS ${pick} ${ok?'✓':'✗'} · ${ou==='O25'?'Üst':'Alt'} ${ok2?'✓':'✗'}</div>`;
}
function matchRow(m){
  const P=analyse(m);const vb=m.state==='post'?[]:valueBets(m,P).filter(v=>v.ev*100>=S.minEV);
  const mx=Math.max(P.h,P.d,P.a);const ins=m.state==='pre'?insights(m,P):[];
  const sc=x=>x.score==null||m.state==='pre'?'':`<em>${x.score}</em>`;
  return `<div class="m" data-id="${m.id}">${timeCell(m)}
    <div class="nm"><div><span>${esc(m.home.short)}</span>${sc(m.home)}</div><div><span>${esc(m.away.short)}</span>${sc(m.away)}</div>
      <div class="sub">xG ${fx(P.lh,1)}–${fx(P.la,1)} · Ü2,5 ${pct(P.o25)} · <span class="cf c${P.conf}">${CONF[P.conf]} güven</span>${vb.length?`<span class="vtag">▲ ${vb.length} değer</span>`:''}</div>
      ${ins.length?`<div class="sub">${ins.slice(0,4).map(i=>i[0]).join(' ')}</div>`:''}${checkMark(m)}</div>
    <div class="prob">${[['1',P.h],['X',P.d],['2',P.a]].map(([k,p])=>`<span class="${p===mx?'top':''}">${k}<b>${pct(p)}</b></span>`).join('')}</div></div>`;
}

    ${state.mode==='repo'&&state.repoTime&&Date.now()-new Date(state.repoTime)>3*3600e3?`<div class="warn">Veri dosyası ${Math.round((Date.now()-new Date(state.repoTime))/3600e3)} saattir güncellenmemiş. GitHub'da Actions → Mac verisi görevini kontrol et.</div>`:''}
    <div class="chips">${days}</div>
    <div class="chips"><button class="chip ${state.lgFilter==='all'?'on':''}" data-lg="all">Tüm Ligler</button>${lgsPresent.map(l=>`<button class="chip ${state.lgFilter===l?'on':''}" data-lg="${l}">${esc(LG[l]?.name||l)}</button>`).join('')}</div>
    <div class="chips">${FILTERS.map(f=>`<button class="chip sm ${state.flt===f[0]?'on':''}" data-flt="${f[0]}">${f[1]}</button>`).join('')}</div>
    <input class="search" id="q" placeholder="Takım ismi ile maç ara…" value="${esc(state.q)}">
    <div class="sec"><h3>${state.q?'Arama sonuçları (tüm günler)':FILTERS.find(f=>f[0]===state.flt)?.[1]==='Tümü'?'Günün Bülteni':esc(FILTERS.find(f=>f[0]===state.flt)[1])}</h3><span class="pill">${list.length} Maç</span></div>`;
  if(state.loading&&!state.matches.length)html+=`<div class="empty">⟳<br><br>Günün maç bülteni çekiliyor…</div>`;
  else if(!list.length)html+=`<div class="empty">${state.q?`"${esc(state.q)}" için önümüzdeki 4 gün içinde maç bulunamadı.`:'Bu gün/filtre için maç yok.'}</div>`;
  else{let cur='';list.forEach(m=>{const key=state.q?new Date(m.date).toDateString()+m.lg:m.lg;
    if(key!==cur){cur=key;html+=`<div class="lg">${state.q?new Date(m.date).toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})+' · ':''}${esc(LG[m.lg]?.name||m.lg)}</div>`}html+=matchRow(m)})}
  html+=`<p class="note" style="padding:6px 4px">Simgeler: 🔥 gole açıldı · 🧊 golde kısır · 🛡️ savunma sağlam · ⚽ Üst trendi · 🔒 Alt trendi · 📈/📉 seri · 🏟️ iç/dış saha · 😓 yorgunluk · ⚖️ model–piyasa ayrışması</p>`;
  return html;
}

/* ---------- KUPON MOTORU ---------- */
const MARGIN=0.92; // gerçek oran yoksa: adil oran × 0,92 ≈ tahmini iddaa oranı
const KUPON_TIPLERI=[
  {k:'k1',ad:'Banko Kupon',alt:'En yüksek tutma ihtimali',n:3,pMin:.66,pMax:.90,oMin:1.20,hedef:.78,kasa:2,minConf:3},
  {k:'k2',ad:'Orta Risk',alt:'Dengeli oran / ihtimal',n:4,pMin:.48,pMax:.68,oMin:1.40,hedef:.58,kasa:1,minConf:2},
  {k:'k3',ad:'Sürpriz Kupon',alt:'Zor tutar, yüksek oran',n:5,pMin:.28,pMax:.50,oMin:1.85,hedef:.40,kasa:.5,minConf:2},
];
const KUPON_PAZAR=['1','X','2','1X','X2','O15','O25','U25','O35','U35','KGV','KGY'];
function kuponMaclari(){
  let list=state.matches;
  if(S.kuponGun==='2'&&state.repo){const d2=dayDate(state.day+1);
    list=list.concat(S.leagues.flatMap(lg=>(state.repo.leagues[lg]?.events||[]).filter(ev=>sameLocalDay(ev.date,d2)).map(ev=>parseEvent(ev,lg))));}
  state.extra=state.extra||{};list.forEach(m=>state.extra[m.id]=m);
  return list.filter(m=>m.state==='pre'&&new Date(m.date)>Date.now());
}
function trendBonus(k,m,P){ // seçim, takımların son form trendiyle uyumluysa küçük bonus
  const tags=insights(m,P).map(i=>i[2]);let b=0;
  if(['O25','O35','KGV'].includes(k))b+=tags.filter(t=>t==='over'||t==='up').length*.04;
  if(['U25','U35','KGY'].includes(k))b+=tags.filter(t=>t==='under'||t==='down').length*.04;
  return b;
}
function adaylar(m){
  const P=analyse(m);const {o,src}=oddsFor(m);
  return MARKETS.filter(([k])=>KUPON_PAZAR.includes(k)).map(([k,l,f])=>{const p=f(P);const real=o[k]>1;
    return {m,k,l,p,odd:real?o[k]:+(MARGIN/p).toFixed(2),real,src:real?src[k]:'tahmini',conf:P.conf,tb:trendBonus(k,m,P)}});
}
function kuponYap(T,maclar){
  const best=[];
  maclar.forEach(m=>{
    let c=adaylar(m).filter(a=>a.p>=T.pMin&&a.p<=T.pMax&&a.odd>=T.oMin);
    const strict=c.filter(a=>a.conf>=T.minConf);if(strict.length||T.k==='k1')c=strict;
    if(!c.length)return;
    c.forEach(a=>a.skor=(a.real?Math.min(a.p*a.odd-1,.10)*2:0)+1-Math.abs(a.p-T.hedef)*2+(T.k==='k1'?a.p:0)+a.tb+(a.conf-2)*.05);
    best.push(c.sort((x,y)=>y.skor-x.skor)[0]);
  });
  const sec=best.sort((x,y)=>y.skor-x.skor).slice(0,T.n);
  const oran=sec.reduce((a,b)=>a*b.odd,1),ihtimal=sec.reduce((a,b)=>a*b.p,1);
  return {T,sec,oran,ihtimal,ev:ihtimal*oran-1,stake:S.bank*T.kasa/100};
}
function kuponMetni(K){
  return `${K.T.ad} (${new Date().toLocaleDateString('tr-TR')})\n`+K.sec.map(a=>`${hhmm(a.m.date)} ${a.m.home.short} - ${a.m.away.short}: ${a.l} @${fx(a.odd)}`).join('\n')+
    `\nToplam oran: ${fx(K.oran)} · Tutma ihtimali: %${fx(K.ihtimal*100,1)}`;
}
/* kupon geçmişi: ilk maç başlayana kadar güncellenir, sonra dondurulur */
let kupGecmis=store.get('ia_kup',{});
function kuponKaydet(kuponlar){
  if(state.mode==='demo')return;const dk=new Date().toISOString().slice(0,10);let ch=false;
  kuponlar.forEach(K=>{if(!K.sec.length)return;const key=dk+'|'+K.T.k;const old=kupGecmis[key];
    if(old&&Math.min(...old.picks.map(p=>p.t))<=Date.now())return;
    kupGecmis[key]={ad:K.T.ad,k:K.T.k,oran:+K.oran.toFixed(2),ih:+K.ihtimal.toFixed(4),picks:K.sec.map(a=>({id:a.m.id,k:a.k,l:a.l,odd:a.odd,hn:a.m.home.short,an:a.m.away.short,t:Date.parse(a.m.date)}))};ch=true});
  const keys=Object.keys(kupGecmis).sort();while(keys.length>60){delete kupGecmis[keys.shift()];ch=true}
  if(ch)store.set('ia_kup',kupGecmis);
}
function kuponDurum(c){let hit=0,miss=0,wait=0;
  const picks=c.picks.map(p=>{const r=state.resById?.[p.id];if(!r){wait++;return {...p,s:'⏳'}}const ok=hitOf(p.k,r[0],r[1]);ok?hit++:miss++;return {...p,s:ok?'✓':'✗',sk:r[0]+'-'+r[1]}});
  return {picks,hit,miss,wait,durum:miss?'YATTI':wait?'Devam ediyor':'TUTTU'};
}
function vOneri(){
  const maclar=kuponMaclari();
  const kuponlar=KUPON_TIPLERI.map(T=>kuponYap(T,maclar));state.kuponlar=kuponlar;kuponKaydet(kuponlar);
  let html=`<div class="sec"><h3>Günün Kuponları</h3><span class="pill">${maclar.length} maç</span></div>
   ${state.repo?`<div class="chips"><button class="chip ${S.kuponGun!=='2'?'on':''}" data-kg="1">Sadece seçili gün</button><button class="chip ${S.kuponGun==='2'?'on':''}" data-kg="2">Seçili gün + ertesi gün</button></div>`:''}`;
  if(maclar.length<2)html+=`<div class="empty">Kupon için başlamamış en az 2 maç gerekiyor.<br><br>Bülten'den "Yarın"ı seç ya da "Seçili gün + ertesi gün"ü dene.</div>`;
  else kuponlar.forEach((K,i)=>{
    html+=`<div class="cp ${K.T.k}"><div class="cp-h"><div><b>${K.T.ad}</b><small>${K.T.alt}</small></div><b>${K.sec.length?fx(K.oran):'-'}</b></div>`;
    if(!K.sec.length){html+=`<div class="empty" style="border-radius:0">Bu risk seviyesine uyan maç bulunamadı.</div></div>`;return}
    html+=K.sec.map(a=>`<div class="cp-row" data-id="${a.m.id}"><div><div class="pk">${a.l}</div><div class="mt">${hhmm(a.m.date)} · ${esc(a.m.home.short)} – ${esc(a.m.away.short)} · <span class="cf c${a.conf}">${CONF[a.conf]}</span></div></div>
      <div class="mt">${pct(a.p)}</div><div class="od">${a.real?'':'≈'}${fx(a.odd)}</div></div>`).join('');
    html+=`<div class="cp-f"><div>Tutma ihtimali<b>%${fx(K.ihtimal*100,1)}</b></div><div>Toplam oran<b>${fx(K.oran)}</b></div><div>Öneri (kasa %${K.T.kasa})<b>${fx(K.stake,0)} ₺</b></div></div>
      <div class="cp-a"><button data-copy="${i}">📋 Kopyala</button><button data-imp="${i}">➕ Kuponuma aktar</button></div></div>`;
  });
  const gecmis=Object.entries(kupGecmis).filter(([k,c])=>Math.min(...c.picks.map(p=>p.t))<=Date.now()).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);
  if(gecmis.length){
    const st=gecmis.map(([k,c])=>kuponDurum(c));const bitti=st.filter(x=>x.durum!=='Devam ediyor');const tuttu=st.filter(x=>x.durum==='TUTTU').length;
    html+=`<div class="sec" style="margin-top:18px"><h3>Geçmiş Kuponlar</h3><span class="pill">${tuttu}/${bitti.length} tuttu</span></div>`;
    gecmis.forEach(([k,c],i)=>{const d=st[i];
      html+=`<div class="card hist"><div class="r"><b>${esc(c.ad)} · ${k.slice(8,10)}.${k.slice(5,7)}</b><span class="dr ${d.durum==='TUTTU'?'ok':d.durum==='YATTI'?'no':''}">${d.durum}</span></div>
        ${d.picks.map(p=>`<div class="r small"><span>${p.s} ${esc(p.hn)} – ${esc(p.an)}: <b>${esc(p.l)}</b></span><span>${p.sk||''} @${fx(p.odd)}</span></div>`).join('')}
        <div class="r small mute"><span>Toplam oran ${fx(c.oran)}</span><span>${d.hit} ✓ · ${d.miss} ✗ · ${d.wait} ⏳</span></div></div>`});
  }
  return html+`<p class="note" style="padding:0 4px">Banko kupona sadece "Yüksek güven" maçlar girer. Takımların son form trendiyle uyumlu seçimler öne alınır. ≈ işaretli oranlar tahminidir; gerçek iddaa oranını maç detayına girersen kupon onu kullanır. Tutma ihtimali maçların birbirinden bağımsız olduğu varsayımıyla hesaplanır; garanti değildir.</p>`;
}

/* ---------- KENDİ KUPONUM (sanal oyun) ---------- */
let myPicks=store.get('ia_my',[]),myCps=store.get('ia_mycp',[]);
function saveMy(){store.set('ia_my',myPicks);badge()}
function saveCps(){store.set('ia_mycp',myCps)}
function badge(){const b=document.querySelector('#nav [data-tab="kupon"]');if(!b)return;let s=b.querySelector('.bdg');
  if(!s){s=document.createElement('span');s.className='bdg';b.appendChild(s)}s.textContent=myPicks.length;s.style.display=myPicks.length?'':'none'}
function togglePick(m,k,l,p,odd,est){
  const i=myPicks.findIndex(x=>x.id===m.id);
  const pk={id:m.id,lg:m.lg,k,l,p:+p.toFixed(3),odd:+(+odd).toFixed(2),est,hn:m.home.short,an:m.away.short,t:Date.parse(m.date)};
  if(i>=0&&myPicks[i].k===k){myPicks.splice(i,1);saveMy();return 'Kupondan çıkarıldı'}
  if(i>=0){myPicks[i]=pk;saveMy();return 'Bu maçtaki seçim değiştirildi'}
  myPicks.push(pk);saveMy();return `Kupona eklendi (${myPicks.length} maç)`;
}
function cpEval(c){let hit=0,miss=0,wait=0;
  const picks=c.picks.map(p=>{const r=state.resById?.[p.id];if(!r){wait++;return {...p,s:'⏳'}}const ok=hitOf(p.k,r[0],r[1]);ok?hit++:miss++;return {...p,s:ok?'✓':'✗',sk:r[0]+'-'+r[1]}});
  const durum=miss?'YATTI':wait?'Bekliyor':'TUTTU';return {picks,hit,miss,wait,durum,ret:durum==='TUTTU'?c.stake*c.oran:0}}
function myText(picks,oran,stake,title){

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-kv],[data-rm],[data-imp],[data-cpcopy],[data-cpdel],#mySave,#myCopy,#myClr,#bkCopy,#bkLoad');if(!t)return;

    myPicks=K.sec.map(a=>({id:a.m.id,lg:a.m.lg,k:a.k,l:a.l,p:+a.p.toFixed(3),odd:a.odd,est:!a.real,hn:a.m.home.short,an:a.m.away.short,t:Date.parse(a.m.date)}));
    saveMy();state.kv='my';render();window.scrollTo(0,0);toast('Kuponuna aktarıldı; istediğin gibi değiştirebilirsin')}
  else if(t.dataset.cpcopy!=null){const c=myCps[+t.dataset.cpcopy];if(c)copyText(myText(c.picks,c.oran,c.stake,c.ad))}
  else if(t.dataset.cpdel!=null){if(t.dataset.sure){myCps.splice(+t.dataset.cpdel,1);saveCps();render()}else{t.dataset.sure='1';t.textContent='Emin misin? Tekrar bas'}}
  else if(t.id==='mySave'){if(myPicks.some(p=>p.t<=Date.now())){toast('Başlamış maçları çıkar');return}
    const oran=myPicks.reduce((a,p)=>a*p.odd,1);
    myCps.push({ts:Date.now(),ad:'Kupon #'+(myCps.length+1),stake:state.myStake??100,oran:+oran.toFixed(2),ih:myPicks.reduce((a,p)=>a*p.p,1),picks:myPicks.slice()});
    saveCps();myPicks=[];saveMy();state.kv='hist';render();window.scrollTo(0,0);toast('Kupon kaydedildi')}
  else if(t.id==='myCopy'){copyText(myText(myPicks,myPicks.reduce((a,p)=>a*p.odd,1),state.myStake??100,'Kuponum'))}
  else if(t.id==='myClr'){if(t.dataset.sure){myPicks=[];saveMy();render()}else{t.dataset.sure='1';t.textContent='Emin misin?'}}
  else if(t.id==='bkCopy'){copyText('IDDAA1:'+btoa(unescape(encodeURIComponent(JSON.stringify({my:myPicks,cps:myCps})))))}
  else if(t.id==='bkLoad'){const ta=$('#bkText');if(ta.style.display==='none'){ta.style.display='block';ta.focus();return}
    try{const j=JSON.parse(decodeURIComponent(escape(atob(ta.value.trim().replace(/^IDDAA1:/,'')))));const have=new Set(myCps.map(c=>c.ts));
      (j.cps||[]).forEach(c=>{if(!have.has(c.ts))myCps.push(c)});myCps.sort((a,b)=>a.ts-b.ts);saveCps();if(!myPicks.length&&j.my)myPicks=j.my;saveMy();render();toast('Yedek yüklendi')}
    catch(err){toast('Yedek kodu okunamadı')}}
});

function vAnaliz(){
  const K=karne();
  let html=`<div class="sec"><h3>Analiz</h3></div>
   <div class="card"><h4>Model karnesi</h4>${K.n?`<div class="cp-f" style="padding:0"><div>MS tahmini<b>%${fx(K.ms/K.n*100,0)}</b></div><div>Alt/Üst 2,5<b>%${fx(K.ou/K.n*100,0)}</b></div><div>KG Var/Yok<b>%${fx(K.kg/K.n*100,0)}</b></div></div>
     <p class="note">Uygulamanın maç öncesi kaydettiği ${K.n} tahmin sonuçla karşılaştırıldı. MS için %50 üstü, Alt/Üst ve KG için %55 üstü iyi sayılır. Brier skoru: ${fx(K.brier/K.n,3)} (düşük = iyi, 0,60 altı iyi).</p>`
     :`<p class="note">Henüz sonuçlanmış tahmin yok. Uygulamayı açtıkça maç öncesi tahminler kaydedilir; maçlar bitince başarı oranı burada görünür.</p>`}</div>`;
  const list=state.matches.filter(m=>m.state==='pre').map(m=>({m,P:analyse(m)}));
  if(!list.length)return html+`<div class="empty">Başlamamış maç yok. Bülten'den başka bir gün seç.</div>`;
  const rows=(arr,fn,lab)=>arr.length?`<div class="card"><h4>${lab}</h4><table>${arr.map(({m,P})=>`<tr data-id="${m.id}"><td>${esc(m.home.short)} – ${esc(m.away.short)}</td><td><b>${fn(P,m)}</b></td></tr>`).join('')}</table></div>`:'';
  const by=(f,n=6)=>[...list].sort((a,b)=>f(b.P,b.m)-f(a.P,a.m)).slice(0,n);
  const teams=[],seenT=new Set();list.forEach(({m})=>[m.home,m.away].forEach(t=>{if(seenT.has(t.id))return;seenT.add(t.id);const f=formOf(t.id,5,null,Date.parse(m.date));if(f.n>=3)teams.push({t,f,m})}));
  const tRows=(arr,lab,fn)=>arr.length?`<div class="card"><h4>${lab}</h4><table>${arr.map(x=>`<tr data-id="${x.m.id}"><td>${esc(x.t.short)}</td><td>${fl(x.f)}</td><td><b>${fn(x.f)}</b></td></tr>`).join('')}</table></div>`:'';
  html+=rows(by(P=>Math.max(P.h,P.a)),P=>pct(Math.max(P.h,P.a))+(P.h>P.a?' (1)':' (2)'),'En güçlü favoriler')
   +rows(by(P=>P.o25),P=>pct(P.o25),'2,5 Üst olasılığı en yüksek')
   +rows(by(P=>1-P.o25),P=>pct(1-P.o25),'2,5 Alt olasılığı en yüksek')
   +rows(by(P=>P.btts),P=>pct(P.btts),'KG Var olasılığı en yüksek')
   +rows(by(P=>P.d),P=>pct(P.d),'Beraberliğe en yakın')
   +tRows([...teams].sort((a,b)=>b.f.ppg-a.f.ppg).slice(0,6),'Bugünün en formda takımları (son 5)',f=>fx(f.ppg,1)+' puan/maç')
   +tRows([...teams].sort((a,b)=>b.f.gf/b.f.n-a.f.gf/a.f.n).slice(0,6),'En golcü takımlar (son 5)',f=>f.gf+' gol')
   +tRows([...teams].sort((a,b)=>a.f.ppg-b.f.ppg).slice(0,6),'Formsuz takımlar (son 5)',f=>fx(f.ppg,1)+' puan/maç');
  return html;
}

     ${ins.length?`<div class="card"><h4>Öne çıkanlar</h4>${ins.map(i=>`<div class="ins"><span>${i[0]}</span><span>${i[1]}</span></div>`).join('')}</div>`:''}
     <div class="card"><h4>Maç sonucu olasılığı</h4>
      <div class="bar"><div class="b1" style="width:${P.h*100}%">1 ${pct(P.h)}</div><div class="bx" style="width:${P.d*100}%">X ${pct(P.d)}</div><div class="b2" style="width:${P.a*100}%">2 ${pct(P.a)}</div></div>
      ${P.market?`<table style="margin-top:8px"><tr><th></th><th>1</th><th>X</th><th>2</th></tr><tr><td>Model (form)</td><td>${pct(P.model.h)}</td><td>${pct(P.model.d)}</td><td>${pct(P.model.a)}</td></tr><tr><td>Bahis sitesi</td><td>${pct(P.market.h)}</td><td>${pct(P.market.d)}</td><td>${pct(P.market.a)}</td></tr><tr><td><b>Sonuç (%${S.market} piyasa)</b></td><td><b>${pct(P.h)}</b></td><td><b>${pct(P.d)}</b></td><td><b>${pct(P.a)}</b></td></tr></table>`:''}
      <p class="note">Beklenen gol: <b>${fx(P.lh)}</b> – <b>${fx(P.la)}</b> · Lig ort. ${fx(L.avg)} gol/takım · Ev avantajı ×${fx(L.hfa)} · Kaynak: ${L.src==='form'?`son maçlar (${L.nH} ve ${L.nA} maç, rakip gücüne göre düzeltilmiş)`:'sezon ortalaması'}</p>
      ${L.src==='form'?`<div class="stt"><div>${esc(m.home.short)} hücum<b>${fx(L.attH*100,0)}</b></div><div>${esc(m.home.short)} savunma<b>${fx(200-L.defH*100,0)}</b></div><div>${esc(m.away.short)} hücum<b>${fx(L.attA*100,0)}</b></div><div>${esc(m.away.short)} savunma<b>${fx(200-L.defA*100,0)}</b></div></div><p class="note">100 = lig ortalaması; yüksek daha iyi.</p>`:''}</div>
     <div class="card"><h4>Pazarlar · iddaa oranını gir, değeri gör</h4><div class="grid">
      ${MARKETS.map(([k,l,f])=>{const p=f(P),odd=o[k],ev=odd>1?evOf(p,odd):null;const val=ev!=null&&ev*100>=S.minEV&&ev<=.2;
        return `<div class="mk ${val?'val':''}"><div class="r"><b>${l}</b><span>${pct(p)}</span></div>
        <div class="r"><small>Adil ${fx(1/p)}</small><input inputmode="decimal" data-mk="${k}" value="${mo[k]||''}" placeholder="${odd?fx(odd):'oran'}"></div>
        <div class="r"><small>${odd?esc(src[k]):''}</small><span class="ev ${ev>0?'pos':'neg'}">${ev==null?'':(ev>.2?'⚠️ +':ev>0?'▲ +':'▼ ')+fx(ev*100,1)+'%'}</span></div>
        ${m.state==='pre'&&Date.parse(m.date)>Date.now()?(()=>{const on=myPicks.some(x=>x.id===m.id&&x.k===k);return `<button class="addk ${on?'on':''}" data-add="${k}">${on?'✓ Kuponda':'+ Kupona ekle'}</button>`})():''}</div>`}).join('')}
     </div><p class="note">Adil oran = 1 / olasılık. Girilen oran adil orandan yüksekse değer vardır (▲). Kasa önerisi: ${valueBets(m,P).filter(v=>v.stake>0).map(v=>`${v.l} ${fx(v.stake,0)} ₺`).join(', ')||'—'}</p></div>
     <div class="card"><h4>En olası skorlar</h4><div class="scores">${P.scores.map(x=>`<div><b>${x.s}</b>${pct(x.p)}</div>`).join('')}</div></div>
     ${formBlock(m.home,true,kick)}${formBlock(m.away,false,kick)}
     ${sh||sa?`<div class="card"><h4>Puan durumu</h4><table><tr><th>Takım</th><th>Sıra</th><th>O</th><th>P</th><th>AG</th><th>YG</th></tr>${[[sh,m.home.short],[sa,m.away.short]].map(([t,n])=>t?`<tr><td>${esc(n)}</td><td>${t.rank||'-'}</td><td>${t.gp}</td><td>${t.pts??'-'}</td><td>${t.gf}</td><td>${t.ga}</td></tr>`:'').join('')}</table></div>`:''}`;
    $('#cls').onclick=close;
    document.querySelectorAll('#sheetIn [data-add]').forEach(btn=>btn.onclick=ev=>{ev.stopPropagation();const k=btn.dataset.add;const mk=MARKETS.find(x=>x[0]===k);const p=mk[2](P);
      const odd=o[k]>1?o[k]:MARGIN/p;toast(togglePick(m,k,mk[1],p,odd,!(o[k]>1)));const sc=$('#sheet .in').scrollTop;draw();$('#sheet .in').scrollTop=sc;render();});
    document.querySelectorAll('#sheetIn input[data-mk]').forEach(inp=>inp.onchange=e=>{
      const v=parseFloat(String(e.target.value).replace(',','.'));manualOdds[m.id]=manualOdds[m.id]||{};
      if(v>1)manualOdds[m.id][e.target.dataset.mk]=v;else delete manualOdds[m.id][e.target.dataset.mk];
      store.set('ia_odds',manualOdds);state.ver++;const sc=$('#sheet .in').scrollTop;draw();$('#sheet .in').scrollTop=sc;render();});
  };
  const close=()=>$('#sheet').classList.remove('on');
  draw();$('#sheet').classList.add('on');$('#sheet .in').scrollTop=0;
}

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-day],[data-lg],[data-flt],[data-id],[data-tlg],[data-kg],[data-copy],#pullOdds,#save,#clr,#refresh');
  if(e.target.id==='sheet'){$('#sheet').classList.remove('on');return}
  if(!t)return;
  if(t.dataset.kg){S.kuponGun=t.dataset.kg;store.set('ia_settings',S);render();return}
  if(t.dataset.copy!=null){const K=state.kuponlar?.[+t.dataset.copy];if(K){navigator.clipboard?.writeText(kuponMetni(K)).then(()=>toast('Kupon kopyalandı'),()=>toast('Kopyalanamadı'))}return}
  if(t.dataset.flt){state.flt=t.dataset.flt;render();return}
  if(t.dataset.tab){state.tab=t.dataset.tab;render();window.scrollTo(0,0)}
  else if(t.dataset.day!=null){state.day=+t.dataset.day;state.lgFilter='all';loadAll()}
  else if(t.dataset.lg){state.lgFilter=t.dataset.lg;render()}
  else if(t.dataset.tlg){const id=t.dataset.tlg;S.leagues=S.leagues.includes(id)?S.leagues.filter(x=>x!==id):[...S.leagues,id];store.set('ia_settings',S);render()}
  else if(t.dataset.id&&!t.closest('#sheet')){openMatch(t.dataset.id)}
  else if(t.id==='pullOdds')loadOddsAPI();
  else if(t.id==='refresh')loadAll();
  else if(t.id==='save'){const n=(id,d)=>{const v=parseFloat(String($(id).value).replace(',','.'));return Number.isFinite(v)?v:d};
    S.proxy=$('#sProxy').value;S.oddsKey=$('#sKey').value.trim();S.halfLife=n('#sHL',45);S.market=Math.min(100,Math.max(0,n('#sMk',60)));S.k=n('#sK',4);S.rho=n('#sRho',-0.05);
    S.minEV=n('#sEV',5);S.bank=n('#sBank',1000);S.kelly=n('#sKelly',25);store.set('ia_settings',S);state.lastProxy=null;state.rCache={};state.ver++;aCache.clear();toast('Kaydedildi');loadAll()}
  else if(t.id==='clr'){try{Object.keys(localStorage).filter(k=>k.startsWith('ia_st_')||k==='ia_apiodds').forEach(k=>localStorage.removeItem(k))}catch(e){}
    apiOdds={t:0,data:{}};state.ver++;aCache.clear();toast('Önbellek temizlendi');loadAll()}
});

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}

render();loadAll();
</script>
</body>
</html>
